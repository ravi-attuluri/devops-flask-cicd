<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ app_name }}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <div class="logo">DevOps App</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/status">Status</a>
    </div>
</nav>

<section class="hero">

    <div class="hero-content">

        <p class="tag">🚀 DEVOPS CI/CD PROJECT</p>

        <h1>{{ app_name }}</h1>

        <p class="description">
            A Flask application deployed using
            GitHub, Jenkins, Docker and AWS EC2.
        </p>

        <div class="buttons">

            <a href="/status" class="btn">
                Application Status
            </a>

            <a href="/health" class="btn secondary">
                Health Check
            </a>

        </div>

    </div>

</section>

<section class="info">

    <div class="card">

        <h3>☁️ Environment</h3>

        <p>AWS EC2</p>

    </div>

    <div class="card">

        <h3>🐳 Container</h3>

        <p>Docker</p>

    </div>

    <div class="card">

        <h3>⚙️ CI/CD</h3>

        <p>Jenkins</p>

    </div>

    <div class="card">

        <h3>📦 Version</h3>

        <p>{{ version }}</p>

    </div>

</section>

<footer>

    <p>
        DevOps Flask CI/CD Project
    </p>

</footer>

</body>

</html>
